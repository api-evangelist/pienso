aid: pienso
name: Pienso
description: >-
  Pienso is an interactive no-code AI and machine learning platform, founded in
  2016 out of MIT by Karthik Dinakar and Birago Jones and headquartered in the
  Washington, DC / Arlington, VA area. It lets subject-matter experts explore,
  train, fingerprint, annotate, and deploy deep-learning and large language
  models over unstructured text — customer calls, emails, documents, and social
  content — through a point-and-click interface with no coding required. Product
  capabilities include Ingest, Train & Fingerprint, Annotate, Dataset Analysis,
  and PromptFactory, applied to use cases such as customer insight, content
  moderation, document intelligence, and risk detection. Pienso is deployed into
  the customer's own environment — AWS, Azure, GCP, Gcore, or on-premises — so
  data never leaves the customer's control, and the company publishes no public
  developer API, SDK, or documentation surface; integration is sales-led and the
  platform runs as a self-contained system. Backed by Uncork Capital.
